<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisab — Profit / Loss</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6f8b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hisab">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7785;--line:#dde3ea;--pri:#1f6f8b;--g:#0a8a4a;--r:#c62828;--gb:#e6f5ec;--rb:#fdeaea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b232c;--tx:#e8edf2;--mut:#93a1b0;--line:#2c3744;--pri:#59b4d1;--g:#4cd08a;--r:#ff7b7b;--gb:#143324;--rb:#3a1d1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b232c;--tx:#e8edf2;--mut:#93a1b0;--line:#2c3744;--pri:#59b4d1;--g:#4cd08a;--r:#ff7b7b;--gb:#143324;--rb:#3a1d1d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;padding-bottom:84px}
#res{position:sticky;top:0;z-index:5;padding:10px 14px 8px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:1px solid var(--line)}
#res .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
#res small{color:var(--mut);font-size:12px}
#pl{font-size:30px;font-weight:700;line-height:1.1}
#tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px}
.pos{color:var(--g)}.neg{color:var(--r)}
.tpos{background:var(--gb);color:var(--g)}.tneg{background:var(--rb);color:var(--r)}.tzero{background:var(--line);color:var(--mut)}
main{padding:12px;max-width:560px;margin:0 auto}
h2{font-size:20px;margin:6px 2px 4px}
.hint{color:var(--mut);font-size:13px;margin:0 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
label.f{display:block;margin-bottom:10px;font-size:14px}
label.f span{display:block;color:var(--mut);margin-bottom:4px;font-size:13px}
input{width:100%;font-size:17px;padding:11px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);min-width:0}
input:focus{outline:2px solid var(--pri);border-color:var(--pri)}
.item{display:grid;gap:6px;align-items:end;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.item small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}
.x{border:0;background:none;color:var(--r);font-size:22px;padding:6px;cursor:pointer}
.add{width:100%;padding:11px;border:1px dashed var(--pri);background:none;color:var(--pri);border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:700;margin-top:8px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:10px}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--line);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 2px 8px;font-size:11px;cursor:pointer}
nav button b{display:block;font-size:18px;margin-bottom:1px}
nav button.on{color:var(--pri);font-weight:700}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow small{color:var(--mut)}
.sum div{display:flex;justify-content:space-between;padding:5px 0}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="res">
  <div class="row"><div><small>PROFIT / LOSS is hafte</small><div id="pl">0</div></div><div style="text-align:right"><span id="tag" class="tzero">—</span><br><small>Aaj ki raqam</small> <b id="net">0</b></div></div>
</div>
<main id="m"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const KEY="hisab_app_v1";
const def={s:{mpt:145.5,wr:246,kr:246,siz:20,maz:560,tape:170,pick:52,wid:39,wc:35,kc:30.3,taar:2814,k:1850,clr:"",cutr:""},d:{prev:0,cap:0,wd:0,bags:[{}],loose:[],siz:[],cut:0,roll:0,tk:0,bank:0,hand:0,lena:[],mach:[],dena:[]},h:[]};
let A=JSON.parse(JSON.stringify(def)),tab=0;
try{const x=localStorage.getItem(KEY);if(x)A=Object.assign(A,JSON.parse(x))}catch(e){}
if(A.s&&A.s.wr===undefined){A.s.clr="";A.s.cutr=""}A.s=Object.assign({},def.s,A.s);A.d=Object.assign({},def.d,A.d);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}};
const n=v=>parseFloat(v)||0, f=v=>Math.round(v).toLocaleString("en-IN");
const sg=v=>(v>0?"+":v<0?"−":"")+f(Math.abs(v));
const d=()=>A.d, s=()=>A.s;
function rates(){const S=s(),k=n(S.k)||1850,wk=n(S.wc)?n(S.tape)*n(S.pick)*n(S.wid)/k/n(S.wc):0,kk=n(S.kc)?n(S.tape)*n(S.taar)/k/n(S.kc):0;
 const cutA=kk*(n(S.kr)+n(S.siz)),cpt=wk*n(S.wr)+cutA+n(S.maz),clrA=n(S.mpt)?cpt/n(S.mpt):0,has=v=>v!==""&&v!==undefined&&v!==null;
 return{wk,kk,cutA,cpt,clrA,cutr:has(S.cutr)?n(S.cutr):cutA,clr:has(S.clr)?n(S.clr):clrA}}
function calc(){const D=d(),S=s();
 const r3=a=>a.reduce((t,x)=>t+n(x.b)*n(x.k)*n(x.r),0);
 const bags=r3(D.bags),loose=D.loose.reduce((t,x)=>t+n(x.k)*n(x.r),0),siz=r3(D.siz);
 const Rt=rates(),cut=n(D.cut)*Rt.cutr,roll=n(D.roll)*Rt.clr,tk=n(D.tk)*n(S.mpt)*Rt.clr;
 const sm=a=>a.reduce((t,x)=>t+n(x.a),0);
 const stock=bags+loose+siz+cut+roll+tk,cash=n(D.bank)+n(D.hand),lena=sm(D.lena),mach=sm(D.mach),dena=sm(D.dena);
 const net=stock+cash+lena+mach-dena, pl=net-n(D.prev)-n(D.cap)+n(D.wd);
 return{bags,loose,siz,cut,roll,tk,stock,cash,lena,mach,dena,net,pl}}
function upd(){const c=calc(),p=document.getElementById("pl"),t=document.getElementById("tag");
 p.textContent=sg(c.pl);p.className=c.pl>0?"pos":c.pl<0?"neg":"";
 t.textContent=c.pl>0?"PROFIT":c.pl<0?"LOSS":"BARABAR";t.className=c.pl>0?"tpos":c.pl<0?"tneg":"tzero";
 document.getElementById("net").textContent=f(c.net);
 document.querySelectorAll("[data-sum]").forEach(e=>e.textContent=f(c[e.dataset.sum]));
 const Rt=rates();document.querySelectorAll("[data-r]").forEach(e=>e.textContent=Rt[e.dataset.r].toFixed(2));save();return c}
const fld=(path,lab,hint)=>`<label class="f"><span>${lab}</span><input type="number" inputmode="decimal" step="any" data-p="${path}" value="${getv(path)}" placeholder="0"></label>`;
function getv(p){let o=A,k=p.split(".");for(const q of k)o=o?.[q];return o===undefined||o===0?"":o}
function setv(p,v){let o=A,k=p.split(".");for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
function list(key,title,cols,addTxt,sum){const rows=d()[key];
 return`<div class="card"><h3>${title}</h3>`+rows.map((r,i)=>`<div class="item" style="grid-template-columns:${cols.map(c=>c.w||"1fr").join(" ")} 34px">`+cols.map(c=>`<div><small>${c.l}</small><input ${c.t==="text"?'type="text"':'type="number" inputmode="decimal" step="any"'} data-p="d.${key}.${i}.${c.k}" value="${r[c.k]??""}" placeholder="${c.ph||"0"}"></div>`).join("")+`<button class="x" data-del="${key}.${i}" aria-label="hatayein">×</button></div>`).join("")
 +`<button class="add" data-add="${key}">+ ${addTxt}</button>`+(sum?`<div class="tot"><span>Total</span><span data-sum="${sum}">0</span></div>`:"")+`</div>`}
const yarn=[{k:"b",l:"Bags"},{k:"k",l:"kg per bag"},{k:"r",l:"Rate / kg"}];
const money=[{k:"n",l:"Naam",t:"text",ph:"Naam / party",w:"1.4fr"},{k:"a",l:"Raqam"}];
const views=[
()=>`<h2>1. Pichle hafte se</h2><p class="hint">Pehle hafte me pichli raqam 0 rakhein, aur jo paisa lagaya wo “naya paisa lagaya” me likhein.</p><div class="card">${fld("d.prev","Pichle hafte ki Net raqam (₹)")}${fld("d.cap","Is hafte naya paisa lagaya (₹)")}${fld("d.wd","Is hafte paisa nikala — ghar kharch (₹)")}</div>`,
()=>`<h2>2. Maal (stock)</h2><p class="hint">Aaj jo maal hai wo ginein. Rate Settings se lagta hai.</p>`+
 list("bags","Baana yarn — bags",yarn,"Bags jodein","bags")+list("loose","Khula baana / tarashan / nari",[{k:"k",l:"kg"},{k:"r",l:"Rate / kg"}],"Khula yarn jodein","loose")+
 list("siz","Taana yarn — sizing me",yarn,"Sizing yarn jodein","siz")+
 `<div class="card"><h3>Cloth</h3>${fld("d.cut","Cut baaki (abhi bunna baaki)")}<p class="hint" style="margin-top:-4px">Loom pe bane roll ka hissa yahan mat ginein.</p>${fld("d.roll","Roll ka maal — loom pe (meter)")}${fld("d.tk","Takha stock (number)")}</div>
 <div class="card sum"><div><span>Maal ka total</span><b data-sum="stock">0</b></div></div>`,
()=>`<h2>3. Paisa</h2><p class="hint">Cash, lena aur dena. Baaki bijli / sizing bill “Dena” me likhein.</p><div class="card">${fld("d.bank","Cash in account (₹)")}${fld("d.hand","Cash in hand (₹)")}</div>`+
 list("lena","Lena — jo paisa aana hai",money,"Lena jodein","lena")+list("mach","Machine / loom / deposit (aaj ki value)",money,"Machine jodein","mach")+list("dena","Dena — jo paisa dena hai",money,"Dena jodein","dena"),
()=>{const c=calc();return`<h2>4. Hafta</h2><div class="card sum"><h3>Hisab</h3><div><span>Maal</span><b data-sum="stock">0</b></div><div><span>Cash</span><b data-sum="cash">0</b></div><div><span>Lena</span><b data-sum="lena">0</b></div><div><span>Machine</span><b data-sum="mach">0</b></div><div><span>Minus: Dena</span><b data-sum="dena">0</b></div><div style="border-top:1px solid var(--line);margin-top:4px;padding-top:8px"><span><b>Aaj ki Net raqam</b></span><b data-sum="net">0</b></div></div>
 <button class="btn" id="saveW">Is hafte ko save karein</button><p class="hint">Save karne par Net raqam agle hafte ke liye “pichli raqam” ban jaati hai aur naya hafta shuru hota hai.</p>
 <h2>Pichle hafte</h2><div class="card">${A.h.length?A.h.slice().reverse().map((x,i)=>`<div class="hrow"><div><b>${x.date}</b><br><small>Net ${f(x.net)}</small></div><div style="display:flex;align-items:center;gap:6px"><b class="${x.pl>=0?"pos":"neg"}">${sg(x.pl)}</b><button class="x" data-hd="${A.h.length-1-i}">×</button></div></div>`).join("")+`<div class="tot"><span>Ab tak ka total</span><span class="${A.h.reduce((t,x)=>t+x.pl,0)>=0?"pos":"neg"}">${sg(A.h.reduce((t,x)=>t+x.pl,0))}</span></div>`:'<p class="hint">Abhi koi hafta save nahi hua.</p>'}</div>`},
()=>`<h2>Settings</h2><p class="hint">Excel jaisa hisab: quality aur rate bharein, cloth aur cut ka rate apne aap banega. Sirf rate ya quality badle tabhi badlein.</p>
<div class="card sum"><h3>Jo rate use hoga</h3><div><span>Cloth rate per meter</span><b>₹ <span data-r="clr">0</span></b></div><div><span>Cut rate (1 cut)</span><b>₹ <span data-r="cutr">0</span></b></div></div>
<div class="card"><h3>Yarn rate aur mazdoori</h3>${fld("s.wr","Baana (weft) yarn rate / kg")}${fld("s.kr","Taana (warp) yarn rate / kg")}${fld("s.siz","Sizing charge / kg")}${fld("s.maz","Mazdoori per takha (sab kharch)")}</div>
<div class="card"><h3>Quality</h3>${fld("s.mpt","Meter per takha")}${fld("s.tape","Tapeline")}${fld("s.pick","Pick")}${fld("s.wid","Width (inch)")}${fld("s.wc","Baana count")}${fld("s.kc","Taana count")}${fld("s.taar","Taar (total warp ends)")}${fld("s.k","Fixed number (1850)")}</div>
<div class="card sum"><h3>Auto hisab</h3><div><span>Baana kg per takha</span><b data-r="wk">0</b></div><div><span>Taana kg per takha</span><b data-r="kk">0</b></div><div><span>Auto cut rate</span><b data-r="cutA">0</b></div><div><span>Costing per takha</span><b data-r="cpt">0</b></div><div><span>Auto cloth rate / meter</span><b data-r="clrA">0</b></div></div>
<div class="card"><h3>Apna rate lagana ho (optional)</h3><p class="hint">Khali chhodein to auto rate chalega.</p>${fld("s.clr","Cloth rate per meter — apna (₹)")}${fld("s.cutr","Cut rate — apna (₹)")}</div>
<button class="btn s" id="reset">Saara data saaf karein</button>`
];
const tabs=[["📥","Pichla"],["📦","Maal"],["💰","Paisa"],["📊","Hafta"],["⚙️","Settings"]];
function render(){document.getElementById("m").innerHTML=views[tab]();
 document.getElementById("nav").innerHTML=tabs.map((t,i)=>`<button class="${i===tab?"on":""}" data-t="${i}"><b>${t[0]}</b>${t[1]}</button>`).join("");upd()}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
document.addEventListener("input",e=>{const p=e.target.dataset?.p;if(!p)return;const k=p.split("."),last=k[k.length-1];
 setv(p,e.target.type==="text"?e.target.value:(e.target.value===""?"":parseFloat(e.target.value)));upd()});
document.addEventListener("focusin",e=>{if(e.target.type==="number")e.target.select?.()});
document.addEventListener("click",e=>{const t=e.target.closest("[data-t],[data-add],[data-del],[data-hd],#saveW,#reset");if(!t)return;
 if(t.dataset.t!==undefined){tab=+t.dataset.t;render();scrollTo(0,0)}
 else if(t.dataset.add){d()[t.dataset.add].push({});render()}
 else if(t.dataset.del){const[k,i]=t.dataset.del.split(".");d()[k].splice(+i,1);render()}
 else if(t.dataset.hd){A.h.splice(+t.dataset.hd,1);render()}
 else if(t.id==="saveW"){const c=calc();A.h.push({date:new Date().toLocaleDateString("en-GB"),net:c.net,pl:c.pl});d().prev=c.net;d().cap=0;d().wd=0;save();render();toast("Hafta save ho gaya")}
 else if(t.id==="reset"&&confirm("Saara data hat jayega. Pakka?")){A=JSON.parse(JSON.stringify(def));save();render()}});
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body>
</html>
